services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-ai_codebase_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-ai_codebase_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      # qdrant's image ships bash but no curl/wget, so probe the REST port directly.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  node-backend:
    build:
      context: .
      dockerfile: apps/node-backend/Dockerfile
      target: builder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/node-backend/src:/app/apps/node-backend/src
    ports:
      - "${NODE_BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
      target: builder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/ai-service/app:/app/apps/ai-service/app
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Next reads PORT; WEB_PORT is this repo's name for the same thing.
      PORT: ${WEB_PORT:-3000}
    ports:
      # Both sides use WEB_PORT: Next listens on PORT (set above), so a fixed
      # :3000 on the container side would point at nothing when WEB_PORT differs.
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    depends_on:
      - node-backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-ai_codebase_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  # Node services (node-backend, web) share one dev image so pnpm's workspace
  # install/build only needs to run once and both containers reuse the layer.
  node-backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @ai-codebase-copilot/shared-types build && pnpm --filter node-backend dev"
    volumes:
      - .:/app
      - node_backend_modules:/app/node_modules
      - web_modules:/app/apps/web/node_modules
      - backend_modules:/app/apps/node-backend/node_modules
      - shared_types_modules:/app/packages/shared-types/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
    ports:
      - "${NODE_BACKEND_PORT:-4000}:4000"
    depends_on:
      - postgres
      - redis
      - qdrant

  ai-service:
    image: python:3.11-slim
    working_dir: /app/apps/ai-service
    command: sh -c "pip install -r requirements-dev.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/ai-service:/app/apps/ai-service
    env_file:
      - .env
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @ai-codebase-copilot/shared-types build && pnpm --filter web dev"
    volumes:
      - .:/app
      - node_backend_modules:/app/node_modules
      - web_modules:/app/apps/web/node_modules
      - backend_modules:/app/apps/node-backend/node_modules
      - shared_types_modules:/app/packages/shared-types/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - node-backend

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  node_backend_modules:
  web_modules:
  backend_modules:
  shared_types_modules:

# Override file — use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Adds: debug ports, explicit dev env vars, and the one bind mount the base
# file doesn't already cover (web's src, for live reload).
services:
  node-backend:
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --inspect=0.0.0.0:9229
    ports:
      - "9229:9229" # Node.js inspector

  ai-service:
    environment:
      ENVIRONMENT: development
    ports:
      - "5678:5678" # debugpy
    command: python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    environment:
      NODE_ENV: development
      # No NODE_OPTIONS=--inspect here, deliberately. `next dev` spawns a
      # worker process which inherits NODE_OPTIONS, then derives the child's
      # inspector port from it — with an explicit host:port that arithmetic
      # produces an out-of-range value and node exits:
      #   /usr/local/bin/node: must be 0 or in range 1024 to 65535.
      # which crash-loops the container. To debug the Next server, attach with
      # a bare `NODE_OPTIONS=--inspect` (no host:port) for that session only.
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
